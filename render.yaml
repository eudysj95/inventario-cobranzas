# Render Blueprint for Nexo (Web Service + PostgreSQL)
# Deploy: push to main → Render auto-builds & deploys
# Required env vars in Render dashboard (Environment tab):
#   - ADMIN_USERNAME (e.g. admin)
#   - ADMIN_PASSWORD (strong password, will be bcrypt-hashed)
#   - JWT_SECRET (long random string, REQUIRED in production)
#   - INSTANCE_BUSINESS_NAME (display name, e.g. "Mi Negocio")
#   - INSTANCE_CURRENCY_SYMBOL (e.g. "$")
#   - INSTANCE_CURRENCY_LOCALE (e.g. "es-AR")
#   - INSTANCE_WHATSAPP_NUMBER (optional, display only)

services:
  - type: web
    name: nexo-app
    runtime: node
    plan: free
    # Build: install deps (root + workspaces) + build client (Vite → client/dist)
    # Root deps ensure vite & plugin-react are available via ES modules
    buildCommand: npm ci --workspaces --include-workspace-root && npm run build --workspace=client
    # Start: run Express server (serves API + SPA from client/dist)
    startCommand: npm run start --workspace=server
    # Health check endpoint (no auth, hits /health)
    healthCheckPath: /health
    # Environment variables (set these in Render dashboard → Environment tab)
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"

databases:
  - name: nexo-db
    plan: free
    # This creates a free PostgreSQL instance (1 GB, 90-day retention)
    # The connection string will be available as DATABASE_URL environment variable

# Pre-deploy: run migration + seed production data (clothing store data)
preDeployCommand: npm run db:migrate --workspace server && npm run seed:prod --workspace server